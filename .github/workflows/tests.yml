name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 9, 10 and 11 are past security support: Composer blocks them unless advisories
          # are ignored (`insecure`). The override applies to these CI jobs only, never to the package.
          # Laravel 9 and 10 also need older test tools (`legacy`): Pest 1 and Pest 2.
          - { php: '8.1', laravel: '9.*', testbench: '7.*', pest: '^1.23', legacy: true, insecure: true }
          - { php: '8.2', laravel: '9.*', testbench: '7.*', pest: '^1.23', legacy: true, insecure: true }
          - { php: '8.1', laravel: '10.*', testbench: '8.*', pest: '^2.34', legacy: true, insecure: true }
          - { php: '8.2', laravel: '10.*', testbench: '8.*', pest: '^2.34', legacy: true, insecure: true }
          - { php: '8.3', laravel: '10.*', testbench: '8.*', pest: '^2.34', legacy: true, insecure: true }
          - { php: '8.2', laravel: '11.*', testbench: '9.*', insecure: true }
          - { php: '8.3', laravel: '11.*', testbench: '9.*', insecure: true }
          - { php: '8.4', laravel: '11.*', testbench: '9.*', insecure: true }
          - { php: '8.2', laravel: '12.*', testbench: '10.*' }
          - { php: '8.3', laravel: '12.*', testbench: '10.*' }
          - { php: '8.4', laravel: '12.*', testbench: '10.*' }
          - { php: '8.5', laravel: '12.*', testbench: '10.*' }
          - { php: '8.3', laravel: '13.*', testbench: '11.*' }
          - { php: '8.4', laravel: '13.*', testbench: '11.*' }
          - { php: '8.5', laravel: '13.*', testbench: '11.*' }

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, zlib, redis
          coverage: none

      - name: Allow Laravel 9, 10 and 11 (CI only)
        if: matrix.insecure
        run: composer config policy.advisories.block false

      - name: Use the test tools for older Laravel
        if: matrix.legacy
        run: |
          composer remove --dev larastan/larastan phpstan/phpstan-strict-rules laravel/pint --no-update --no-interaction
          composer require --dev "pestphp/pest:${{ matrix.pest }}" --no-update --no-interaction
          if [ "${{ matrix.laravel }}" = "9.*" ]; then
            composer remove --dev pestphp/pest-plugin-arch pestphp/pest-plugin-laravel --no-update --no-interaction
          fi

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/pest --ci
